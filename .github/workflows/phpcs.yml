name: PHPCS
on: [push, pull_request]
jobs:
  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - run: composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true && composer global require -n wp-coding-standards/wpcs:^3.1
      - run: $(composer global config home)/vendor/bin/phpcs --standard=WordPress --extensions=php --ignore=dist .
      - run: for f in $(git ls-files '*.php'); do php -l "$f"; done
